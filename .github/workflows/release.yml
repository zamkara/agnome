name: 🛠️ Agnome Pipeline

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]

jobs:
  quality-check:
    name: 🔍 Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🔎 Validate metadata.json
        run: |
          python3 -c "import json,sys; d=json.load(open('metadata.json')); assert 'uuid' in d and 'version' in d, 'Missing required fields'"

      - name: 📋 Check required files
        run: |
          for f in extension.js prefs.js metadata.json stylesheet.css helpers/pick-folder.js icons/agnome-symbolic.svg schemas/org.gnome.shell.extensions.agnome.gschema.xml; do
            [ -f "$f" ] || { echo "Missing: $f"; exit 1; }
          done

  build:
    name: 📦 Build Extension
    needs: quality-check
    if: success() && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🔨 Install bsdtar
        run: sudo apt-get install -y libarchive-tools

      - name: 📦 Build ZIP
        run: bash package.sh

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agnome-zip
          path: build/*.zip

  release:
    name: 🚀 Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Download artifact
        uses: actions/download-artifact@v4
        with:
          name: agnome-zip
          path: release

      - name: 📝 Generate release body
        id: release_body
        run: |
          TAG_NAME="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -A 1 "^${TAG_NAME}$" | tail -1)
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline --no-merges "${TAG_NAME}" | head -20)
          else
            COMMITS=$(git log --oneline --no-merges "${PREV_TAG}..${TAG_NAME}" | head -20)
          fi

          BODY="## 🛠️ Agnome ${TAG_NAME}"
          BODY="${BODY}\n\nGNOME Shell extension to open project folders with \`agy\` from the top panel."
          BODY="${BODY}\n\n### 📦 Installation"
          BODY="${BODY}\n1. Download the \`.zip\` file below"
          BODY="${BODY}\n2. Install via GNOME Extensions app or:"
          BODY="${BODY}\n\`\`\`bash"
          BODY="${BODY}\ngnome-extensions install agnome-*.zip"
          BODY="${BODY}\n\`\`\`"
          BODY="${BODY}\n\n### ✨ What's Changed"

          if [ -n "$COMMITS" ]; then
            BODY="${BODY}\n"
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              HASH=$(echo "$line" | cut -d' ' -f1)
              MSG=$(echo "$line" | cut -d' ' -f2-)
              BODY="${BODY}\n- ${MSG} ([${HASH}](https://github.com/${{ github.repository }}/commit/${HASH}))"
            done <<< "$COMMITS"
          fi

          BODY="${BODY}\n\n[View full changelog](https://github.com/${{ github.repository }}/commits/${TAG_NAME})"

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo -e "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: ${{ steps.release_body.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
